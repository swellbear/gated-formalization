# ARM hub defaults. Trading NOT ARMED.
# The watch loop reads this file. It never asks a bot.

hub_id: arm_hub
trading_armed: false
paper_mode: true
paper_bankroll_open: 500.0
series: KXBTC15M
interval_s: 30
quotes_source: replay
