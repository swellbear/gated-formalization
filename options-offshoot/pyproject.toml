[project]
name = "options-offshoot"
version = "0.1.0"
description = "Uncertainty-aware options paper tape. Separate from Gated Progressive Formalization and from golf-offshoot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.5",
  "fpdf2>=2.8",
  "pypdf>=4.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
options-offshoot = "options_offshoot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
